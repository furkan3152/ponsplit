# Mainnet service. In Render: New → Blueprint → this repo → Blueprint Path: render.mainnet.yaml.
# Render asks for OWNER_ADDRESS: the wallet (ideally a multisig) that will own the contracts.
# Read MAINNET.md before deploying.
services:
  - type: web
    name: ponsplit
    runtime: node
    plan: starter # always on; the free plan sleeps when idle
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NEXT_PUBLIC_CHAIN
        value: mainnet
      - key: SIGNER_SEED
        generateValue: true
      - key: OWNER_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
