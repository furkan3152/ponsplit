[package]
name = "tiktok-escrow"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-panic"]
no-entrypoint = []
custom-panic = []

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[dependencies]
solana-program = "=2.3.0"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))'] }
