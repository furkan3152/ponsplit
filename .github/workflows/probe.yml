name: Probe network

# Diagnostic: checks what the Actions runner can reach (chain RPC, faucet, X profile mirror).
on:
  workflow_dispatch:
    inputs:
      address:
        description: Address to inspect (balance / nonce)
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Chain
        run: |
          rpc=https://rpc.testnet.chain.robinhood.com
          for m in eth_chainId eth_blockNumber eth_gasPrice; do
            echo "$m: $(curl -s -m 20 -X POST -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$m\",\"params\":[]}" $rpc)"
          done
          if [ -n "${{ inputs.address }}" ]; then
            for m in eth_getBalance eth_getTransactionCount; do
              echo "$m: $(curl -s -m 20 -X POST -H 'content-type: application/json' --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$m\",\"params\":[\"${{ inputs.address }}\",\"latest\"]}" $rpc)"
            done
          fi
      - name: Faucet
        run: |
          curl -s -m 20 -D - https://faucet.testnet.chain.robinhood.com -o faucet.html | head -20 || true
          echo "--- html (head)"; head -c 3000 faucet.html || true; echo
          echo "--- scripts"; grep -oE 'src="[^"]+\.js"' faucet.html | head -20 || true
          for s in $(grep -oE 'src="[^"]+\.js"' faucet.html | sed 's/src="//;s/"//' | head -8); do
            case $s in http*) u=$s;; *) u=https://faucet.testnet.chain.robinhood.com$s;; esac
            echo "--- $u"; curl -s -m 20 "$u" | grep -oE '"/api/[^"]{1,80}"|https://[a-zA-Z0-9./_-]*faucet[a-zA-Z0-9./_-]*|captcha|turnstile|recaptcha|hcaptcha|privy|signIn|twitter|github' | sort -u | head -30
          done
      - name: X mirror
        run: |
          curl -s -m 20 https://api.fxtwitter.com/jack | head -c 600; echo
          curl -s -m 20 -o /dev/null -w "unavatar %{http_code}\n" "https://unavatar.io/x/jack?fallback=false"
