name: Stress test

# Load test of the live site (read-only: nothing is signed or sent on-chain). Many requests at once
# to the pages and read APIs and a burst against the chain RPC the browsers use. See scripts/stress.mjs.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site URL
        default: https://splitdev.app
      coin:
        description: A listed coin's address for the coin page (optional)
        default: ""
      rpc:
        description: RPC to burst (the one browsers use)
        default: https://api.mainnet-beta.solana.com
      concurrency:
        description: HTTP requests at a time
        default: "40"
      requests:
        description: HTTP requests per phase
        default: "600"

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: HTTP load
        env:
          SITE: ${{ inputs.site }}
          COIN: ${{ inputs.coin }}
          RPC: ${{ inputs.rpc }}
          CONCURRENCY: ${{ inputs.concurrency }}
          REQUESTS: ${{ inputs.requests }}
        run: node scripts/stress.mjs
