name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      # Unit tests run on the real code: Uniswap v4, Permit2 and a copy of Pons v2 built from their
      # verified sources in contracts/vendor.
      - run: npx hardhat test
      # The committed Pons / Uniswap artifacts (deployed on testnet and local chains) must be exactly
      # what the vendored verified sources compile to.
      - name: Vendored artifacts match their sources
        run: |
          node vendor/build.js
          git diff --exit-code -- vendor/out
      # The web app's ABIs and creation code (src/lib/abi.ts, bytecode.ts) must be the compiled ones.
      - name: The app's ABIs and bytecode match the contracts
        run: |
          node scripts/export-abi.js
          git diff --exit-code -- ../src/lib/abi.ts ../src/lib/bytecode.ts

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install slither-analyzer
      - name: Slither (fails on medium or higher)
        run: slither . --fail-medium

  # SplitEarn against real chain state: on a mainnet fork with the real Pons v2 and Uniswap v4 (and a
  # byte-for-byte check of the vendored Pons code), and on a testnet fork with SplitEarn's own copy of
  # Pons deployed the way /setup does. Read-only towards the real networks.
  pons-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: mainnet
            rpc: https://rpc.mainnet.chain.robinhood.com
          - network: testnet
            rpc: https://rpc.testnet.chain.robinhood.com
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Fork tests (${{ matrix.network }})
        run: npx hardhat test test/fork/PonsMainnet.fork.test.js
        env:
          FORK_URL: ${{ matrix.rpc }}
          FORK_NETWORK: ${{ matrix.network }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npm test
      # What the production host builds: both networks, whatever is pinned in src/deployment.json.
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The real web app (production build) in a real browser with several wallets, on a fork of each
  # Robinhood network. The owner's wallet deploys everything through /setup (testnet: SplitEarn's
  # copy of pons, then SplitEarn; mainnet: SplitEarn on the real pons), the site is rebuilt with the
  # addresses pinned, and a coin is launched with real X accounts, traded on the curve, graduated
  # into its Uniswap v4 pool, traded there, and its fees split. Nothing reaches the real networks.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: testnet
            chain: 46630
            rpc: https://rpc.testnet.chain.robinhood.com
          - network: mainnet
            chain: 4663
            rpc: https://rpc.mainnet.chain.robinhood.com
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NETWORK: ${{ matrix.network }}
      NEXT_PUBLIC_DEFAULT_NETWORK: ${{ matrix.network }}
      # The e2e owner (Hardhat account #4) is the only wallet allowed into /setup.
      ADMIN_ADDRESSES: "0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"
    steps:
      # A fresh signing key per run, made and used inside the job only (masked in the logs).
      - name: Random signing seed
        run: |
          seed=$(openssl rand -hex 32)
          echo "::add-mask::$seed"
          echo "SIGNER_SEED=$seed" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Fork Robinhood Chain ${{ matrix.network }}
        working-directory: contracts
        env:
          HARDHAT_CHAIN_ID: ${{ matrix.chain }}
        run: |
          npx hardhat node --fork ${{ matrix.rpc }} > ../fork.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' http://127.0.0.1:8545 && break; sleep 2; done
          echo
          (cd ../e2e && node prepare-fork.mjs)
      - name: Point the site's ${{ matrix.network }} at the fork
        run: echo "NEXT_PUBLIC_$(echo "$NETWORK" | tr a-z A-Z)_RPC_URL=http://127.0.0.1:8545" >> "$GITHUB_ENV"
      # The repo pins the live deployments; the e2e deploys its own on the fork, so it starts unpinned
      # (the rebuild below pins the fork's addresses through NEXT_PUBLIC_* variables).
      - name: Unpin the live deployment
        run: |
          node -e 'const f="src/deployment.json";const d=require("./"+f);for(const n of Object.keys(d)){for(const k of ["launcher","feeVault","ponsFactory","deployedAt"]) if(k in d[n]) d[n][k]="";d[n].hidden=[]}require("fs").writeFileSync(f,JSON.stringify(d,null,2)+"\n")'
          cat src/deployment.json
      - run: npx next build
      - name: Deploy everything from the owner's wallet through /setup
        run: |
          # node directly (not npx), so the PID is the server itself and kill really stops it.
          node node_modules/.bin/next start -p 3000 > app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          cd e2e && node setup.mjs
          cat deploy.env >> "$GITHUB_ENV"
        env:
          OUT: shots
      - name: Rebuild with the addresses pinned
        run: |
          kill "$APP_PID"
          npx next build
          node node_modules/.bin/next start -p 3000 > app-pinned.log 2>&1 &
      - name: End-to-end on the pinned site
        working-directory: e2e
        run: node full.mjs
        env:
          OUT: shots
      - name: Logs
        if: always()
        run: tail -n 60 app.log app-pinned.log fork.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.network }}
          path: e2e/shots
