name: Verify contracts

# Publishes the source of a deployed FeeVault + SplitLaunchpad on Blockscout, so anyone can read
# the code behind the site and the explorer's Read/Write contract tabs work. Nothing is sent to the
# chain and no key is needed. Run it right after deploying: the constructor arguments are read back
# from the contracts (owner, signer, vault, curve), which match only until they are changed.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network
        type: choice
        options: [robinhood, robinhoodTestnet]
        default: robinhood
      vault:
        description: FeeVault address
        required: true
      launchpad:
        description: SplitLaunchpad address
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      VAULT: ${{ inputs.vault }}
      LAUNCHPAD: ${{ inputs.launchpad }}
      NETWORK: ${{ inputs.network }}
      RPC: ${{ inputs.network == 'robinhood' && (vars.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com') || (vars.ROBINHOOD_TESTNET_RPC_URL || 'https://rpc.testnet.chain.robinhood.com') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Read the constructor arguments back from the chain
        run: |
          node -e '
            const { ethers } = require("ethers");
            const addr = (s) => { if (!/^0x[0-9a-fA-F]{40}$/.test(s || "")) throw new Error("not an address: " + s); return ethers.getAddress(s); };
            (async () => {
              const p = new ethers.JsonRpcProvider(process.env.RPC);
              const vault = new ethers.Contract(addr(process.env.VAULT), ["function owner() view returns (address)", "function signer() view returns (address)"], p);
              const lp = new ethers.Contract(addr(process.env.LAUNCHPAD), [
                "function owner() view returns (address)",
                "function vault() view returns (address)",
                "function curveConfig() view returns (uint256 virtualEth, uint256 virtualToken, uint256 curveSupply, uint256 lpSupply)",
              ], p);
              const [vOwner, signer, lOwner, lVault] = await Promise.all([vault.owner(), vault.signer(), lp.owner(), lp.vault()]);
              const c = await lp.curveConfig();
              const cfg = [c[0], c[1], c[2], c[3]].map(String);
              const fs = require("fs");
              fs.writeFileSync("vault-args.js", "module.exports = " + JSON.stringify([vOwner, signer]) + ";");
              fs.writeFileSync("launchpad-args.js", "module.exports = " + JSON.stringify([lOwner, lVault, cfg]) + ";");
              console.log("FeeVault(owner", vOwner, "signer", signer, ")");
              console.log("SplitLaunchpad(owner", lOwner, "vault", lVault, "curve", cfg.join(", "), ")");
            })().catch((e) => { console.error(e); process.exit(1); });
          '
      - name: Verify FeeVault
        run: npx hardhat verify --network "$NETWORK" --constructor-args vault-args.js "$VAULT"
      - name: Verify SplitLaunchpad
        if: always()
        run: npx hardhat verify --network "$NETWORK" --constructor-args launchpad-args.js "$LAUNCHPAD"
