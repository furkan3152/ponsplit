name: Verify contracts

# Publishes the source of a PonsEarn deployment on Blockscout, so anyone can read the code behind
# the site and the explorer's Read/Write contract tabs work: the launcher, its FeeVault, the
# FeeSplitter implementation every coin clones and the router. Nothing is sent to the chain and no
# key is needed. The launcher and FeeVault were deployed through the CREATE2 proxy from /setup, so
# their constructor arguments are the tail of the proxy call's input (salt + creation code + args);
# the other two are read from the launcher's immutables.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network
        type: choice
        options: [robinhood, robinhoodTestnet]
        default: robinhood
      launcher:
        description: PonsEarnLauncher address
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      LAUNCHER: ${{ inputs.launcher }}
      NETWORK: ${{ inputs.network }}
      RPC: ${{ inputs.network == 'robinhood' && (vars.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com') || (vars.ROBINHOOD_TESTNET_RPC_URL || 'https://rpc.testnet.chain.robinhood.com') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      # verify matches the chain's code against local artifacts, so they must exist first.
      - run: npx hardhat compile
      - name: Find the constructor arguments
        run: |
          node -e '
            const { ethers } = require("ethers");
            const fs = require("fs");
            const addr = (s) => { if (!/^0x[0-9a-fA-F]{40}$/.test(s || "")) throw new Error("not an address: " + s); return ethers.getAddress(s); };
            const EXPLORER = process.env.NETWORK === "robinhood" ? "https://robinhoodchain.blockscout.com" : "https://explorer.testnet.chain.robinhood.com";
            const coder = ethers.AbiCoder.defaultAbiCoder();
            const p = new ethers.JsonRpcProvider(process.env.RPC);
            const artifact = (name) => require("./artifacts/contracts/" + name + ".sol/" + name + ".json");
            // CREATE2 proxy input: 32-byte salt, then the creation code, then the abi-encoded arguments.
            async function fromCreation(address, name, types) {
              try {
                const j = await (await fetch(EXPLORER + "/api/v2/addresses/" + address)).json();
                const hash = j.creation_transaction_hash || j.creation_tx_hash;
                const tx = hash && (await p.getTransaction(hash));
                if (!tx) return null;
                const code = artifact(name).bytecode.slice(2);
                const at = tx.data.indexOf(code);
                if (at < 0) return null;
                return coder.decode(types, "0x" + tx.data.slice(at + code.length));
              } catch (e) {
                console.log("creation transaction not readable (" + e.message + ")");
                return null;
              }
            }
            (async () => {
              const launcherAddr = addr(process.env.LAUNCHER);
              const launcher = new ethers.Contract(launcherAddr, [
                "function owner() view returns (address)",
                "function feeVault() view returns (address)",
                "function ponsFactory() view returns (address)",
                "function ponsEscrow() view returns (address)",
                "function ponsHook() view returns (address)",
                "function poolManager() view returns (address)",
                "function router() view returns (address)",
                "function splitterImplementation() view returns (address)",
              ], p);
              const [vaultAddr, factory, escrow, hook, poolManager, router, splitter] = await Promise.all([
                launcher.feeVault(), launcher.ponsFactory(), launcher.ponsEscrow(), launcher.ponsHook(), launcher.poolManager(), launcher.router(), launcher.splitterImplementation(),
              ]);
              let l = await fromCreation(launcherAddr, "PonsEarnLauncher", ["address", "address", "address"]);
              let v = await fromCreation(vaultAddr, "FeeVault", ["address", "address"]);
              if (!l || !v) {
                console.log("::warning::Using the contracts current state as constructor arguments; this only matches if the owner and signer are unchanged.");
                const vault = new ethers.Contract(vaultAddr, ["function owner() view returns (address)", "function signer() view returns (address)"], p);
                if (!l) l = [await launcher.owner(), vaultAddr, factory];
                if (!v) v = [await vault.owner(), await vault.signer()];
              }
              const write = (file, args) => fs.writeFileSync(file, "module.exports = " + JSON.stringify(args.map(String)) + ";");
              write("launcher-args.js", [...l]);
              write("vault-args.js", [...v]);
              write("splitter-args.js", [launcherAddr, vaultAddr, escrow, hook]);
              write("router-args.js", [poolManager, factory]);
              fs.writeFileSync("addresses.env", ["VAULT=" + vaultAddr, "SPLITTER=" + splitter, "ROUTER=" + router].join("\n") + "\n");
              console.log("PonsEarnLauncher", launcherAddr, [...l]);
              console.log("FeeVault", vaultAddr, [...v]);
              console.log("FeeSplitter", splitter, "PonsEarnRouter", router);
            })().catch((e) => { console.error(e); process.exit(1); });
          '
          cat addresses.env >> "$GITHUB_ENV"
      - name: Verify PonsEarnLauncher
        run: npx hardhat verify --network "$NETWORK" --constructor-args launcher-args.js "$LAUNCHER"
      - name: Verify FeeVault
        if: always()
        run: npx hardhat verify --network "$NETWORK" --constructor-args vault-args.js "$VAULT"
      - name: Verify FeeSplitter (the implementation coins clone)
        if: always()
        run: npx hardhat verify --network "$NETWORK" --constructor-args splitter-args.js "$SPLITTER"
      - name: Verify PonsEarnRouter
        if: always()
        run: npx hardhat verify --network "$NETWORK" --constructor-args router-args.js "$ROUTER"
