name: Deploy contracts

# One-click deploy from the Actions tab (or the GitHub mobile app / API).
#
# The admin key deploys the contracts, owns them, and is the claim/launch signer the web app uses
# (SIGNER_PRIVATE_KEY). Fund its address first (testnet: https://faucet.testnet.chain.robinhood.com).
# Provide it either as the `admin_key` input (masked in logs; visible to repo admins in the run's
# event payload, so only use this on a private repo and for testnet) or as the ADMIN_PRIVATE_KEY secret.
#
# On success the new addresses are committed to src/deployment.json, which the web app reads.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Target network
        type: choice
        options: [robinhoodTestnet, robinhood]
        default: robinhoodTestnet
      admin_key:
        description: Admin private key (leave empty to use the ADMIN_PRIVATE_KEY secret)
        required: false
        default: ""

permissions:
  contents: write

concurrency: deploy-${{ inputs.network }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Load key
        working-directory: .
        run: |
          KEY=$(jq -r '.inputs.admin_key // ""' "$GITHUB_EVENT_PATH")
          [ -z "$KEY" ] && KEY="${{ secrets.ADMIN_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then echo "::error::No admin key: pass admin_key or set the ADMIN_PRIVATE_KEY secret"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "DEPLOYER_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat test
      - name: Check funding
        env:
          RPC: ${{ inputs.network == 'robinhood' && (vars.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com') || (vars.ROBINHOOD_TESTNET_RPC_URL || 'https://rpc.testnet.chain.robinhood.com') }}
        run: |
          ADDR=$(node -e "console.log(new (require('ethers').Wallet)(process.env.DEPLOYER_PRIVATE_KEY).address)")
          echo "CLAIM_SIGNER_ADDRESS=$ADDR" >> "$GITHUB_ENV"
          BAL=$(node -e "const e=require('ethers');new e.JsonRpcProvider(process.env.RPC).getBalance('$ADDR').then(b=>console.log(e.formatEther(b)))")
          echo "Admin $ADDR balance: $BAL ETH"
          if [ "$BAL" = "0.0" ]; then echo "::error::$ADDR has no ETH. Fund it from https://faucet.testnet.chain.robinhood.com and re-run."; exit 1; fi
      - name: Deploy
        run: npx hardhat run scripts/deploy.js --network ${{ inputs.network }}
        env:
          WRITE_WEB_CONFIG: "1"
          ROBINHOOD_TESTNET_RPC_URL: ${{ vars.ROBINHOOD_TESTNET_RPC_URL }}
          ROBINHOOD_RPC_URL: ${{ vars.ROBINHOOD_RPC_URL }}
      - name: Smoke test (read-only)
        run: npx hardhat run scripts/smoke.js --network ${{ inputs.network }}
      - name: Verify on Blockscout
        continue-on-error: true
        run: |
          F=deployments/${{ inputs.network }}.json
          node -e '
            const d = require("./'$F'");
            const cfg = ["1500000000000000000","1073000000000000000000000000","793100000000000000000000000","206900000000000000000000000"];
            require("fs").writeFileSync("verify-args.js", "module.exports = " + JSON.stringify([d.owner, d.feeVault, cfg]) + ";");
          '
          npx hardhat verify --network ${{ inputs.network }} $(jq -r .feeVault $F) $(jq -r .owner $F) $(jq -r .claimSigner $F) || true
          npx hardhat verify --network ${{ inputs.network }} --constructor-args verify-args.js $(jq -r .launchpad $F) || true
      - name: Commit addresses
        working-directory: .
        run: |
          git config user.name "ponsplit-deploy[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add src/deployment.json contracts/deployments/${{ inputs.network }}.json
          git commit -m "Deploy contracts to ${{ inputs.network }}" || exit 0
          git push
      - name: Summary
        run: |
          F=deployments/${{ inputs.network }}.json
          {
            echo "### Deployed to ${{ inputs.network }}"
            echo '```json'; cat "$F"; echo '```'
            echo "Addresses were committed to \`src/deployment.json\`; the web app picks them up on its next build."
          } >> "$GITHUB_STEP_SUMMARY"
