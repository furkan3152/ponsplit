name: Tiksplit

on:
  push:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  escrow-and-pump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A deterministic, public, validator-only program address. No deployment wallet.
      NEXT_PUBLIC_TIKSPLIT_ESCROW_PROGRAM_ID: 3Zw2boFgPgPHoxJEhuAKSyVuWWMWcys6px7kHFxRFirW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - name: Test escrow privileges and accounting
        run: cargo test --locked --manifest-path programs/tiktok-escrow/Cargo.toml
      - name: Install Solana CLI
        run: |
          curl -sSfL https://github.com/anza-xyz/agave/releases/download/v2.3.13/solana-release-x86_64-unknown-linux-gnu.tar.bz2 | tar xj
          echo "$PWD/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build escrow executable
        run: |
          node scripts/build-escrow-artifact.mjs
          git diff --exit-code -- public/programs
      - name: Start validator with real pump.fun and escrow programs
        run: e2e/solana/validator.sh "$RUNNER_TEMP/tiksplit-ledger" --bpf-program "$NEXT_PUBLIC_TIKSPLIT_ESCROW_PROGRAM_ID" programs/tiktok-escrow/target/deploy/tiktok_escrow.so
      - name: Launch, trade, distribute, verify and claim
        run: |
          node e2e/solana/build-lib.mjs
          node e2e/solana/tiktok-local.mjs
          node e2e/solana/manual-proof-local.mjs
      - name: Deploy, interrupt, resume and refund with the real loader
        run: RPC=http://127.0.0.1:8899 node e2e/solana/program-deploy-local.mjs
      - name: Close an active escrow and verify rent refund and shutdown
        run: ACTIVE_CLOSE_RPC_PORT=18919 node e2e/solana/program-close-active-local.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Exercise fail-closed setup mode even when the repository pins a live program.
      NEXT_PUBLIC_TIKSPLIT_ESCROW_PROGRAM_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Browser setup and responsive UI checks
        run: |
          node node_modules/.bin/next start -p 3000 > app.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
          BASE=http://localhost:3000 node tiksplit-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiksplit-browser-shots
          path: e2e/shots
