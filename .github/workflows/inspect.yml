name: Inspect deployment

# Read-only: checks live contracts straight from the chain (code, wiring, signer, owners, terms).
# With `site`, also simulates a launch end to end: the site attests real X accounts and createToken
# is simulated on the live contracts with that attestation. Nothing is ever sent.
on:
  workflow_dispatch:
    inputs:
      network:
        description: testnet or mainnet
        default: testnet
      vault:
        description: FeeVault address
        required: true
      launchpad:
        description: SplitLaunchpad address
        required: true
      admin:
        description: Server-deployed setups only (testnet) - admin address from /setup; checks its nonce 0/1 contracts and signer
        default: ""
      owner:
        description: Expected owner of both contracts (optional), e.g. the wallet that deployed them on mainnet
        default: ""
      site:
        description: Site URL to simulate a launch through (optional), e.g. https://ponsplit-testnet.onrender.com
        default: ""
      handles:
        description: X usernames for the simulated launch, comma-separated
        default: jack

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/inspect-deployment.mjs
        env:
          NETWORK: ${{ inputs.network }}
          VAULT: ${{ inputs.vault }}
          LAUNCHPAD: ${{ inputs.launchpad }}
          ADMIN: ${{ inputs.admin }}
          OWNER: ${{ inputs.owner }}
      - if: inputs.site != ''
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/smoke-live.mjs
        env:
          NETWORK: ${{ inputs.network }}
          LAUNCHPAD: ${{ inputs.launchpad }}
          SITE: ${{ inputs.site }}
          HANDLES: ${{ inputs.handles }}
