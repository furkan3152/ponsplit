name: Inspect deployment

# Read-only: checks a live SplitEarn deployment straight from the chain (code, wiring, the pons
# factory, signer, owners, terms). With `site`, also simulates a launch end to end: the site attests
# real X accounts and the launch is simulated on the live contracts. Nothing is ever sent.
on:
  workflow_dispatch:
    inputs:
      network:
        description: testnet or mainnet
        default: testnet
      launcher:
        description: SplitEarnLauncher address
        required: true
      owner:
        description: Expected owner (optional), the wallet that deployed from /setup
        default: ""
      signer:
        description: Expected signing key address (optional), as /api/config shows it
        default: ""
      site:
        description: Site URL to simulate a launch through (optional)
        default: ""
      handles:
        description: X usernames for the simulated launch, comma-separated
        default: jack

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/inspect-deployment.mjs
        env:
          NETWORK: ${{ inputs.network }}
          LAUNCHER: ${{ inputs.launcher }}
          OWNER: ${{ inputs.owner }}
          SIGNER: ${{ inputs.signer }}
      - if: inputs.site != ''
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/smoke-live.mjs
        env:
          NETWORK: ${{ inputs.network }}
          LAUNCHER: ${{ inputs.launcher }}
          SITE: ${{ inputs.site }}
          HANDLES: ${{ inputs.handles }}
