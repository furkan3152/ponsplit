# One-click Render deploy: https://render.com/deploy?repo=https://github.com/furkan3152/ponsplit
# SIGNER_SEED is generated by Render and never leaves it; the admin key is derived from it.
# After the first deploy, open /setup on the site to fund the admin address and deploy the contracts.
services:
  - type: web
    name: ponsplit
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: SIGNER_SEED
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
