# https://render.com/deploy?repo=https://github.com/furkan3152/ponsplit
# One service serves both Robinhood networks; visitors pick one at the top of the page.
# SIGNER_SEED is generated by Render and never leaves it; the signing key is derived from it. After
# the first deploy, open /setup and deploy the contracts from your own wallet (see MAINNET.md).
services:
  - type: web
    name: ponsearn
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: SIGNER_SEED
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
